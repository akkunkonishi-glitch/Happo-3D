<script>
'use strict';
const statusEl=document.getElementById('status');
if(!window.Cesium){statusEl.textContent='Cesiumを読み込めませんでした。通信を確認してください。';throw new Error('no Cesium')}
Cesium.Ion.defaultAccessToken='';  // Cesium ionは使わない（トークン不要）

const boundary=[[137.79031276702884, 36.71360253057494], [137.79031276702884, 36.71360253057494], [137.78507709503177, 36.709955790915565], [137.78507709503177, 36.709955790915565], [137.78447628021243, 36.705345513841785], [137.78447628021243, 36.705345513841785], [137.7805280685425, 36.68999886813347], [137.7805280685425, 36.68999886813347], [137.7827596664429, 36.685456224030055], [137.7827596664429, 36.685456224030055], [137.80009746551517, 36.673065830877334], [137.80009746551517, 36.673065830877334], [137.8038311004639, 36.67110383562481], [137.8038311004639, 36.67110383562481], [137.808895111084, 36.67351329647276], [137.808895111084, 36.67351329647276], [137.81473159790042, 36.68012171607383], [137.81473159790042, 36.68012171607383], [137.82494544982913, 36.68397636535661], [137.82494544982913, 36.68397636535661], [137.84365653991702, 36.69608971975234], [137.84365653991702, 36.69608971975234], [137.84760475158694, 36.69963389154272], [137.84760475158694, 36.69963389154272], [137.8463172912598, 36.709061281169646], [137.8463172912598, 36.709061281169646], [137.8379058837891, 36.71525382744859], [137.8379058837891, 36.71525382744859], [137.82709121704104, 36.721273880045004], [137.82709121704104, 36.721273880045004], [137.8239154815674, 36.72086109150479], [137.8239154815674, 36.72086109150479], [137.8115558624268, 36.71604506128931], [137.8115558624268, 36.71604506128931], [137.80554771423343, 36.715150622433804], [137.80554771423343, 36.715150622433804], [137.7917289733887, 36.713912151442244], [137.7917289733887, 36.713912151442244]];
// 表示範囲：北アルプス全体
const LIMIT={west:137.3,south:36.0,east:138.2,north:36.9,maxHeight:60000};
const limitRect=Cesium.Rectangle.fromDegrees(137.25,35.95,138.25,36.95);
// ===== 設定（ここの数字を変えるだけで調整できます）=====
// ===== 初期視点（ページを開いたときのカメラ）=====
// 「初期視点をコピー」でコピーした値をここに貼ると、全端末で同じ初期視点になる。
// 端末で「現在の視点を初期位置にする」を押した場合は、その端末だけ保存値(localStorage)が優先される。
//   lon/lat：経度・緯度、height：カメラの標高(m)、heading：方位(度、北=0・東=90)、pitch：傾き(度、マイナスで見下ろし)、
//   aboveGround：地表からの高さ(m)。地形の読み込み後、その地点の地表＋この高さに合わせる（nullならheightのまま）
const DEFAULT_VIEW={lon:137.814,lat:36.618,height:7500,heading:0,pitch:-32,aboveGround:null};
const VIEW_KEY='happoInitialView';
const SETTINGS={
  followHeight:20,   // 地表追従の既定の高さ(m)。画面右端のスライダーで2〜100mに変更できる
  rotateSpeed:1.5,   // 2本指でひねったときの回転の感度(1=指と同じ角度)
  tiltSpeed:0.009,   // 2本指上下の傾き・見上げの感度(1pxあたりのラジアン)
  skyDragSpeed:0.006,// 空をドラッグしたときの向きの感度(1pxあたりのラジアン)
  followSmoothing:0.6,// 地表追従で高さを合わせる速さ(0〜1、1で即座)
  resetHeading:250,  // 「ゲレンデ向き」ボタンの方位(度、北=0・東=90)
  resetPitch:-15,    // 「ゲレンデ向き」ボタンの傾き(度、マイナスで見下ろし、0で水平)
  resetHeight:20,    // 「ゲレンデ向き」ボタンでの地表からの高さ(m)。nullにすると今の高さのまま
  minimapZoom:15,    // ミニマップの既定の縮尺(ズーム。大きいほど拡大)
  minimapSize:200,   // ミニマップの大きさ(px)
  stickYawSpeed:60,  // 視点スティック：左右に回る速さ(度/秒、倒し量に関係なく一定)
  stickPitchSpeed:40 // 視点スティック：見上げ・見下ろしの速さ(度/秒)
};

const EDIT=new URLSearchParams(location.search).get('edit')==='1';
async function copyText(txt){  // クリップボードにコピー（使えない環境では別の方法で）
  try{await navigator.clipboard.writeText(txt);return true}
  catch(e){const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok}}  // URLに ?edit=1 を付けたときだけコース編集モード
// ===== 国土地理院DEM（PNG標高タイル）=====
// h=(R*65536+G*256+B)/100、x=0x800000は無効値、x>0x800000は負値。ズーム14以下=10m(dem_png)、ズーム15=5m(dem5a_png)。
// 5mの無効値・欠けは10mの値を補間して埋め、それも無ければ周囲の値→0。PNGは自前で解凍し、ブラウザの色補正の影響を受けない。
async function gsiHeights(z,x,y,signal){
  const GSI='https://cyberjapandata.gsi.go.jp/xyz/';
  async function heights(layer,lz,lx,ly,sig){
    const r=await fetch(GSI+layer+'/'+lz+'/'+lx+'/'+ly+'.png',{signal:sig});if(!r.ok)return null;
    const buf=new Uint8Array(await r.arrayBuffer());
    const u32=o=>((buf[o]<<24)|(buf[o+1]<<16)|(buf[o+2]<<8)|buf[o+3])>>>0;
    let o=8,W=0,H=0,depth=0,ctype=0,inter=0,plte=null,trns=null;const idat=[];
    while(o<buf.length){const len=u32(o),type=String.fromCharCode(buf[o+4],buf[o+5],buf[o+6],buf[o+7]),d=buf.subarray(o+8,o+8+len);
      if(type==='IHDR'){W=u32(o+8);H=u32(o+12);depth=d[8];ctype=d[9];inter=d[12]}else if(type==='PLTE')plte=d;else if(type==='tRNS')trns=d;else if(type==='IDAT')idat.push(d);else if(type==='IEND')break;o+=12+len}
    if(W!==256||H!==256||depth!==8||inter!==0||![0,2,3,4,6].includes(ctype))return null;
    const raw=new Uint8Array(await new Response(new Blob(idat).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer());
    const bpp={0:1,2:3,3:1,4:2,6:4}[ctype],stride=W*bpp,px=new Uint8Array(H*stride);
    for(let row=0;row<H;row++){const f=raw[row*(stride+1)],src=row*(stride+1)+1,dst=row*stride,up=dst-stride;
      for(let i=0;i<stride;i++){const v=raw[src+i],a=i>=bpp?px[dst+i-bpp]:0,b=row?px[up+i]:0,c=(row&&i>=bpp)?px[up+i-bpp]:0;let pr;
        if(f===0)pr=0;else if(f===1)pr=a;else if(f===2)pr=b;else if(f===3)pr=(a+b)>>1;else{const p=a+b-c,pa=Math.abs(p-a),pb=Math.abs(p-b),pc=Math.abs(p-c);pr=(pa<=pb&&pa<=pc)?a:(pb<=pc?b:c)}
        px[dst+i]=(v+pr)&255}}
    const h=new Float32Array(65536);
    for(let k=0;k<65536;k++){let R,G,B,A=255;
      if(ctype===2){R=px[k*3];G=px[k*3+1];B=px[k*3+2];if(trns&&trns.length>=6&&R===trns[1]&&G===trns[3]&&B===trns[5])A=0}
      else if(ctype===6){R=px[k*4];G=px[k*4+1];B=px[k*4+2];A=px[k*4+3]}
      else if(ctype===3){const q=px[k];R=plte[q*3];G=plte[q*3+1];B=plte[q*3+2];if(trns&&q<trns.length)A=trns[q]}
      else{R=G=B=px[k*bpp];if(ctype===4)A=px[k*2+1]}
      const v=R*65536+G*256+B;h[k]=(A===0||v===8388608)?NaN:(v>8388608?(v-16777216)/100:v/100)}
    return h}
  function fill(h){
    for(let pass=0;pass<2;pass++){const at=pass?(i,j)=>i*256+j:(i,j)=>j*256+i;
      for(let j=0;j<256;j++){let last=NaN;const fwd=new Float32Array(256);
        for(let i=0;i<256;i++){const v=h[at(i,j)];if(!Number.isNaN(v))last=v;fwd[i]=last}last=NaN;
        for(let i=255;i>=0;i--){const k=at(i,j),v=h[k];if(!Number.isNaN(v)){last=v;continue}const L=fwd[i];h[k]=Number.isNaN(L)?last:(Number.isNaN(last)?L:(L+last)/2)}}}
    for(let k=0;k<65536;k++)if(Number.isNaN(h[k]))h[k]=0;return h}
  function parent10(px_,py_){
    const C=globalThis.__gsiParent||(globalThis.__gsiParent=new Map()),key=px_+'/'+py_;
    if(!C.has(key)){const pr=heights('dem_png',14,px_,py_).then(h=>h&&fill(h));pr.catch(()=>C.delete(key));C.set(key,pr);if(C.size>24)C.delete(C.keys().next().value)}
    return C.get(key)}
  let h;
  if(z<=14){h=await heights('dem_png',z,x,y,signal);if(!h)return new Float32Array(65536);fill(h)}
  else{
    h=await heights('dem5a_png',15,x,y,signal);let hasNA=!h;
    if(h)for(let k=0;k<65536;k++)if(Number.isNaN(h[k])){hasNA=true;break}
    if(hasNA){let P=null;try{P=await parent10(x>>1,y>>1)}catch(e){}
      if(!h){if(!P)return new Float32Array(65536);h=new Float32Array(65536).fill(NaN)}
      if(P){const ox=(x&1)*128,oy=(y&1)*128;
        for(let row=0;row<256;row++)for(let col=0;col<256;col++){const k=row*256+col;if(!Number.isNaN(h[k]))continue;
          const fx=Math.min(255,Math.max(0,ox+(col+0.5)/2-0.5)),fy=Math.min(255,Math.max(0,oy+(row+0.5)/2-0.5)),x0=Math.floor(fx),y0=Math.floor(fy),x1=Math.min(255,x0+1),y1=Math.min(255,y0+1),tx=fx-x0,ty=fy-y0;
          h[k]=(P[y0*256+x0]*(1-tx)+P[y0*256+x1]*tx)*(1-ty)+(P[y1*256+x0]*(1-tx)+P[y1*256+x1]*tx)*ty}}
      fill(h)}}
  return h}
// 標高処理は別スレッド(Worker)で行い、画面の操作を止めない
let demWorker=null,demSeq=0;const demPending=new Map();
try{if(typeof DecompressionStream!=='undefined'){
  const src=gsiHeights.toString()+";self.onmessage=async e=>{const m=e.data;try{const h=await gsiHeights(m.z,m.x,m.y);self.postMessage({id:m.id,h},[h.buffer])}catch(err){self.postMessage({id:m.id,err:String(err)})}};";
  demWorker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
  demWorker.onmessage=e=>{const p=demPending.get(e.data.id);if(!p)return;demPending.delete(e.data.id);e.data.h?p.res(e.data.h):p.rej(e.data.err)};
  demWorker.onerror=()=>{demWorker=null;for(const p of demPending.values())p.rej('worker');demPending.clear()}}}catch(e){demWorker=null}
function demCall(z,x,y){
  if(!demWorker)return gsiHeights(z,x,y);
  return new Promise((res,rej)=>{const id=++demSeq;demPending.set(id,{res,rej});demWorker.postMessage({id,z,x,y})}).catch(()=>gsiHeights(z,x,y))}

// ===== 地形・航空写真 =====
const merc=new Cesium.WebMercatorTilingScheme();
const terrainProvider=new Cesium.CustomHeightmapTerrainProvider({

// ===== 初期視点 =====
function viewOblique(duration){camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(137.814,36.618,7500),orientation:{heading:0,pitch:Cesium.Math.toRadians(-32),roll:0},duration})}
function viewTop(duration){camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(137.814,36.696,12000),orientation:{heading:0,pitch:-Cesium.Math.PI_OVER_TWO,roll:0},duration})}
function loadInitialView(){try{const v=JSON.parse(localStorage.getItem(VIEW_KEY)||'null');if(v&&isFinite(v.lon)&&isFinite(v.lat)&&isFinite(v.height))return Object.assign({},DEFAULT_VIEW,v)}catch(e){}return Object.assign({},DEFAULT_VIEW)}
let pendingGroundFix=null;  // 地形が細かく読み込まれていく間（最大30秒）、「地表＋aboveGround」に合わせ続ける
function applyView(v){
  camera.setView({destination:Cesium.Cartesian3.fromDegrees(v.lon,v.lat,v.height),orientation:{heading:Cesium.Math.toRadians(v.heading||0),pitch:Cesium.Math.toRadians(v.pitch==null?-32:v.pitch),roll:0}});
  pendingGroundFix=v.aboveGround!=null&&isFinite(v.aboveGround)?{lon:v.lon,lat:v.lat,above:+v.aboveGround,until:performance.now()+30000,lastH:v.height,first:true}:null;scene.requestRender()}

// ===== 等高線：10m(細・薄)と50m(太)を地表の標高から描く =====
// 等高線の見た目（数字を変えるだけで調整できます）。線は白、明るい地面で目立ちすぎないよう両側に薄い黒の縁取りを添える
const CONTOUR_STYLE={
  minorAlpha:0.25, minorWidth:1.0,   // 10m線：白の不透明度・線幅(px)
  majorAlpha:0.5,  majorWidth:1.5,   // 50m線：白の不透明度・線幅(px)
  haloAlpha:0.18,  haloWidth:0.75    // 縁取り：黒の不透明度・線の片側に足す幅(px)。縁取りが要らなければ haloAlpha:0
};
const contourMaterial=new Cesium.Material({fabric:{type:'HappoContour',
  uniforms:{minorColor:new Cesium.Color(1,1,1,CONTOUR_STYLE.minorAlpha),majorColor:new Cesium.Color(1,1,1,CONTOUR_STYLE.majorAlpha),haloColor:new Cesium.Color(0,0,0,CONTOUR_STYLE.haloAlpha),
    minorSpacing:10,majorSpacing:50,minorWidth:CONTOUR_STYLE.minorWidth,majorWidth:CONTOUR_STYLE.majorWidth,haloWidth:CONTOUR_STYLE.haloWidth},
  source:`uniform vec4 minorColor;uniform vec4 majorColor;uniform vec4 haloColor;uniform float minorSpacing;uniform float majorSpacing;uniform float minorWidth;uniform float majorWidth;uniform float haloWidth;
czm_material czm_getMaterial(czm_materialInput materialInput){
  czm_material material=czm_getDefaultMaterial(materialInput);
  float h=materialInput.height;
  float dF=max(abs(dFdx(h)),abs(dFdy(h)))*czm_pixelRatio;  // 1ピクセルあたりの標高差
  float dMin=mod(h,minorSpacing);dMin=min(dMin,minorSpacing-dMin);
  float dMaj=mod(h,majorSpacing);dMaj=min(dMaj,majorSpacing-dMaj);
  vec4 c=vec4(0.0);
  bool minorOk=dF*(minorWidth+2.0*haloWidth)<minorSpacing*0.3, majorOk=dF*(majorWidth+2.0*haloWidth)<majorSpacing*0.3;  // 線が混みすぎる距離では出さない
  if(minorOk){if(dMin<dF*minorWidth*0.5)c=minorColor;else if(dMin<dF*(minorWidth*0.5+haloWidth))c=haloColor;}
  if(majorOk){if(dMaj<dF*majorWidth*0.5)c=majorColor;else if(dMaj<dF*(majorWidth*0.5+haloWidth)&&c.a==0.0)c=haloColor;}
  vec4 o=czm_gammaCorrect(c);material.diffuse=o.rgb;material.alpha=o.a;return material;}`}});
globe.material=contourMaterial;
// 50mごとの数字：画面中心付近のDEM(10m)から50mの線をまたぐ地点を探して置く
const labelSource=new Cesium.CustomDataSource('contourLabels');viewer.dataSources.add(labelSource);
const labelTiles=new Map();let contourOn=true,labelSeq=0;
async function updateLabels(){
  const seq=++labelSeq;
  const carto=camera.positionCartographic,g=globe.getHeight(carto);
  if(!contourOn||g===undefined||carto.height-g>3500){labelSource.entities.removeAll();scene.requestRender();return}
  const ray=camera.getPickRay(new Cesium.Cartesian2(scene.canvas.clientWidth/2,scene.canvas.clientHeight*0.6));
  const hit=ray&&globe.pick(ray,scene);const c=hit?Cesium.Cartographic.fromCartesian(hit):carto;
  const n=1<<14,lon=Cesium.Math.toDegrees(c.longitude),lat=Cesium.Math.toDegrees(c.latitude);
  const tx=Math.floor((lon+180)/360*n),ty=Math.floor((1-Math.log(Math.tan(c.latitude)+1/Math.cos(c.latitude))/Math.PI)/2*n);
  const tiles=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)tiles.push([tx+dx,ty+dy]);
  const data=await Promise.all(tiles.map(([x,y])=>{const k=x+'/'+y;if(!labelTiles.has(k)){labelTiles.set(k,demCall(14,x,y));if(labelTiles.size>18)labelTiles.delete(labelTiles.keys().next().value)}return labelTiles.get(k)}));
  if(seq!==labelSeq)return;
  const used=new Set(),labels=[],STEP=8;
  tiles.forEach(([x,y],i)=>{const h=data[i];if(!h)return;
    for(let r=0;r+STEP<256;r+=STEP)for(let col=0;col+STEP<256;col+=STEP){
      const a=h[r*256+col];for(const [r2,c2] of [[r,col+STEP],[r+STEP,col]]){const b=h[r2*256+c2],la=Math.floor(a/50),lb=Math.floor(b/50);if(la===lb)continue;
        const L=Math.max(la,lb)*50,t=(L-a)/(b-a),pr=r+(r2-r)*t,pc=col+(c2-col)*t;
        const LON=(x+(pc+0.5)/256)/n*360-180,LAT=Math.atan(Math.sinh(Math.PI*(1-2*(y+(pr+0.5)/256)/n)))*180/Math.PI;
        const key=L+'_'+Math.floor(LON/0.004)+'_'+Math.floor(LAT/0.003);if(used.has(key))continue;used.add(key);labels.push([LON,LAT,L])}}});
  labelSource.entities.suspendEvents();labelSource.entities.removeAll();
  for(const [LON,LAT,L] of labels.slice(0,70))labelSource.entities.add({position:Cesium.Cartesian3.fromDegrees(LON,LAT,L+2),label:{text:L+'m',font:'bold 13px sans-serif',fillColor:Cesium.Color.WHITE,outlineColor:Cesium.Color.BLACK,outlineWidth:3,style:Cesium.LabelStyle.FILL_AND_OUTLINE,distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,3500)}});
  labelSource.entities.resumeEvents();scene.requestRender()}
let labelTimer=null;const labelSoon=()=>{clearTimeout(labelTimer);labelTimer=setTimeout(updateLabels,400)};
camera.percentageChanged=0.1;camera.changed.addEventListener(labelSoon);camera.moveEnd.addEventListener(labelSoon);
document.getElementById('contour').onclick=()=>{contourOn=!contourOn;globe.material=contourOn?contourMaterial:undefined;document.getElementById('contour').textContent=contourOn?'等高線 ON':'等高線 OFF';updateLabels();scene.requestRender()};

// ===== ロープ（複数本）=====
// 『新しいロープ』で新規開始。連番と色を自動で割り当て。一覧で選択・名前変更・削除。選択中のロープだけ点の追加・1点戻すが効く。
// データは端末(localStorage)に保存し、再読み込みしても残る。点は経度・緯度・標高で保存。
const ROPE_COLORS=['#ffde00','#00e5ff','#ff4081','#76ff03','#ff9100','#d500f9','#ffffff','#2979ff'];
const ROPE_KEY='happoRopes';
let drawing=false,ropeState={ropes:[],selected:null,nextNo:1};
try{const v=JSON.parse(localStorage.getItem(ROPE_KEY)||'null');if(v&&Array.isArray(v.ropes))ropeState=v}catch(e){}
const saveRopes=()=>{try{localStorage.setItem(ROPE_KEY,JSON.stringify(ropeState))}catch(e){}};
const selRope=()=>ropeState.ropes.find(r=>r.id===ropeState.selected)||null;
const ropeCart=r=>r.pts.map(q=>Cesium.Cartesian3.fromDegrees(q[0],q[1],q[2]));
function haversine(a,b){const R=6371000,dl=b.latitude-a.latitude,dn=b.longitude-a.longitude,q=Math.sin(dl/2)**2+Math.cos(a.latitude)*Math.cos(b.latitude)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function ropeDist(r){let d=0,s=0;const c=ropeCart(r);for(let i=1;i<c.length;i++){d+=haversine(Cesium.Cartographic.fromCartesian(c[i-1]),Cesium.Cartographic.fromCartesian(c[i]));s+=Cesium.Cartesian3.distance(c[i-1],c[i])}return {d,s}}
const ropeSrc=new Cesium.CustomDataSource('ropes');viewer.dataSources.add(ropeSrc);
function newRope(){const no=ropeState.nextNo++;const r={id:'r'+Date.now().toString(36)+no,no,name:'ロープ'+no,color:ROPE_COLORS[(no-1)%ROPE_COLORS.length],pts:[]};
  ropeState.ropes.push(r);ropeState.selected=r.id;return r}
function drawRopes(){
  ropeSrc.entities.suspendEvents();ropeSrc.entities.removeAll();
  for(const r of ropeState.ropes){const c=ropeCart(r),col=Cesium.Color.fromCssColorString(r.color),sel=r.id===ropeState.selected;
    if(c.length>=2)ropeSrc.entities.add({polyline:{positions:c,width:sel?6:4,material:sel?new Cesium.PolylineOutlineMaterialProperty({color:col,outlineColor:Cesium.Color.BLACK,outlineWidth:1.5}):col,clampToGround:true}});
    if(sel||c.length===1)c.forEach(p=>ropeSrc.entities.add({position:p,point:{pixelSize:sel?9:6,color:col,outlineColor:Cesium.Color.fromCssColorString('#222'),outlineWidth:1,disableDepthTestDistance:Number.POSITIVE_INFINITY}}))}
  ropeSrc.entities.resumeEvents();
  // 一覧と距離
  const list=document.getElementById('ropeList');list.textContent='';let td=0,ts=0;
  for(const r of ropeState.ropes){const {d,s}=ropeDist(r);td+=d;ts+=s;
    const row=document.createElement('div');row.className='rrow'+(r.id===ropeState.selected?' sel':'');
    const sw=document.createElement('span');sw.className='sw';sw.style.background=r.color;
    const nm=document.createElement('span');nm.className='nm';nm.textContent=r.name;nm.onclick=()=>{ropeState.selected=r.id;saveRopes();drawRopes()};
    const ds=document.createElement('span');ds.className='ds';ds.textContent=Math.round(d)+'m';ds.title='水平 '+Math.round(d)+' m／斜距離 '+Math.round(s)+' m／'+r.pts.length+'点';
    const rn=document.createElement('button');rn.textContent='名前';rn.onclick=()=>{const v=prompt('ロープの名前',r.name);if(v&&v.trim()){r.name=v.trim().slice(0,40);saveRopes();drawRopes()}};
    const del=document.createElement('button');del.textContent='削除';del.onclick=()=>{if(!confirm('「'+r.name+'」を削除しますか？'))return;ropeState.ropes=ropeState.ropes.filter(x=>x!==r);if(ropeState.selected===r.id)ropeState.selected=null;saveRopes();drawRopes()};
    row.append(sw,nm,ds,rn,del);list.appendChild(row)}
  if(!ropeState.ropes.length){const e=document.createElement('div');e.className='rrow';e.textContent='ロープはまだありません';list.appendChild(e)}
  const sr=selRope(),sd=sr&&ropeDist(sr);
  document.getElementById('total').textContent=(sr?'選択中「'+sr.name+'」 水平 '+Math.round(sd.d)+' m／斜距離 '+Math.round(sd.s)+' m（'+sr.pts.length+'点）　':'')+'全体の合計: 水平 '+Math.round(td)+' m／斜距離 '+Math.round(ts)+' m';
  scene.requestRender();try{mini.request()}catch(e){}}
const clickHandler=new Cesium.ScreenSpaceEventHandler(scene.canvas);
clickHandler.setInputAction(e=>{if(!drawing)return;const ray=camera.getPickRay(e.position);const p=ray&&globe.pick(ray,scene);if(!p)return;
  const r=selRope()||newRope(),k=Cesium.Cartographic.fromCartesian(p);
  r.pts.push([+Cesium.Math.toDegrees(k.longitude).toFixed(7),+Cesium.Math.toDegrees(k.latitude).toFixed(7),+k.height.toFixed(2)]);saveRopes();drawRopes()},Cesium.ScreenSpaceEventType.LEFT_CLICK);
const setDrawing=v=>{drawing=v;document.getElementById('draw').textContent=drawing?'打つのを終了':'点を打つ';scene.canvas.style.cursor=drawing?'crosshair':''};
document.getElementById('newRope').onclick=()=>{newRope();saveRopes();setDrawing(true);drawRopes()};
document.getElementById('draw').onclick=()=>{if(!drawing&&!selRope())newRope();setDrawing(!drawing);drawRopes()};
document.getElementById('undo').onclick=()=>{const r=selRope();if(r&&r.pts.length){r.pts.pop();saveRopes();drawRopes()}};
drawRopes();

// ===== 地表追従カメラ =====
// カメラが地表から300m以内に寄ると有効。カメラ直下の地表＋設定高さ(既定20m)を保ち、登りでは上げ、下りでは下げる。
// ズームアウト操作で解除。地形が未読み込みの場所では前回の地表標高を使う。
const FOLLOW_ON=300,followOn=document.getElementById('followOn'),followEl=document.getElementById('follow');
const H_MIN=2,H_MAX=100;let followHeight=SETTINGS.followHeight;
try{const v=+localStorage.getItem('followH');if(v>=H_MIN&&v<=H_MAX)followHeight=v}catch(e){}
const followH=()=>followHeight;
followOn.onchange=()=>{followActive=false;scene.requestRender()};
let followActive=false,followSuppressed=false,lastGround=null,lastInfo='';
function releaseFollow(){if(followActive){followActive=false;followSuppressed=true}}
function setCamHeight(carto,h){camera.setView({destination:Cesium.Cartesian3.fromRadians(carto.longitude,carto.latitude,h),orientation:{heading:camera.heading,pitch:camera.pitch,roll:0}})}
scene.preRender.addEventListener(()=>{
  const carto=camera.positionCartographic.clone();
  // 範囲制限：カメラを北アルプスの範囲内・上限高度以下に保つ
  const lon=Cesium.Math.toDegrees(carto.longitude),lat=Cesium.Math.toDegrees(carto.latitude);
  const cl=Math.min(LIMIT.east,Math.max(LIMIT.west,lon)),ca=Math.min(LIMIT.north,Math.max(LIMIT.south,lat)),ch=Math.min(LIMIT.maxHeight,carto.height);
  if(cl!==lon||ca!==lat||ch!==carto.height){carto.longitude=Cesium.Math.toRadians(cl);carto.latitude=Cesium.Math.toRadians(ca);setCamHeight(carto,ch);carto.height=ch}
  if(pendingGroundFix){const f=pendingGroundFix;
    // 自分でカメラを動かした（位置か高さが最後に合わせた値と違う）／時間切れなら合わせ直しをやめる
    const moved=Math.abs(Cesium.Math.toDegrees(carto.longitude)-f.lon)>0.0005||Math.abs(Cesium.Math.toDegrees(carto.latitude)-f.lat)>0.0005||Math.abs(carto.height-f.lastH)>1;
    if(moved||performance.now()>f.until)pendingGroundFix=null;
    else{const g0=globe.getHeight(Cesium.Cartographic.fromDegrees(f.lon,f.lat));
      if(g0!==undefined&&Math.abs(g0+f.above-carto.height)>0.5){  // 地形が細かくなって地表の標高が変わったら合わせ直す
        const h=g0+f.above;setCamHeight(carto,h);carto.height=h;f.lastH=h;
        if(f.first){f.first=false;
          if(f.above>=H_MIN&&f.above<=H_MAX&&window.__setFollowHeight)window.__setFollowHeight(f.above);  // スライダーの範囲内ならスライダーも合わせる
          else if(f.above<FOLLOW_ON){followSuppressed=true;followActive=false}}  // 100〜300mは追従で引き戻さない
        scene.requestRender()}}}
  const g=globe.getHeight(carto);if(g!==undefined)lastGround=g;
  const above=lastGround==null?null:carto.height-lastGround;
  if(above!=null&&above>FOLLOW_ON+100){followSuppressed=false;followActive=false}
  if(followOn.checked&&!followActive&&!followSuppressed&&above!=null&&above<FOLLOW_ON){followActive=true}
  if(followActive&&followOn.checked&&lastGround!=null){
    const target=lastGround+followH(),k=carto.height<lastGround+2?Math.max(0.8,SETTINGS.followSmoothing):SETTINGS.followSmoothing,next=carto.height+(target-carto.height)*k;
    if(Math.abs(next-carto.height)>0.02){setCamHeight(carto,next);scene.requestRender()}}
  const info=(followOn.checked?(followActive?'追従中':'地表から'+FOLLOW_ON+'m以内で追従'):'追従オフ')+(above!=null?'／地表から約'+Math.round(above)+'m':'');
  if(info!==lastInfo){followEl.textContent=info;lastInfo=info}});
scene.canvas.addEventListener('wheel',e=>{if(e.deltaY>0)releaseFollow()},{passive:true});

// ===== 2本指ジェスチャー（Google Earth風）=====
// 1回の操作ごとに「ズーム(広げる)・回転(ひねる)・傾き(2本で上下)」のどれか1つに判定して固定する。
// 傾きは、地表近く(500m以内)ではその場で見上げ・見下ろし（空も見られる）、高い所では注視点の周りで傾ける。
ssc.zoomEventTypes=[Cesium.CameraEventType.WHEEL,Cesium.CameraEventType.RIGHT_DRAG];
ssc.tiltEventTypes=[Cesium.CameraEventType.MIDDLE_DRAG,{eventType:Cesium.CameraEventType.LEFT_DRAG,modifier:Cesium.KeyboardEventModifier.CTRL},{eventType:Cesium.CameraEventType.RIGHT_DRAG,modifier:Cesium.KeyboardEventModifier.CTRL}];
ssc.rotateEventTypes=[];ssc.inertiaSpin=0;ssc.inertiaTranslate=0;ssc.inertiaZoom=0;  // 慣性なし：指を離したらすぐ止まる  // 1本指ドラッグは下の「地面をつかむ」処理で行う
(function grabDrag(){
  // 1本指(マウス左)ドラッグ：指の下の地面をつかんで引っ張る。空をつかんだときは向き(方位・見上げ)を変える
  const el=scene.canvas,ptrs=new Map();let grab=null;
  const local=e=>{const r=el.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
  el.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,1);
    if(EDIT&&window.__editHit){const r=el.getBoundingClientRect();if(window.__editHit(e.clientX-r.left,e.clientY-r.top)){grab=null;return}}  // 編集モードで頂点をつかんだときは頂点操作に回す
    if(ptrs.size===1&&(e.pointerType!=='mouse'||e.button===0)&&!e.ctrlKey&&!e.shiftKey){const p=local(e),ray=camera.getPickRay(new Cesium.Cartesian2(p.x,p.y)),P0=ray&&globe.pick(ray,scene);
      grab={P0,normal:P0?Cesium.Ellipsoid.WGS84.geodeticSurfaceNormal(P0,new Cesium.Cartesian3()):null,last:p}}else grab=null});
  el.addEventListener('pointermove',e=>{
    if(!grab||ptrs.size!==1||!ptrs.has(e.pointerId))return;const p=local(e);
    if(grab.P0){const ray=camera.getPickRay(new Cesium.Cartesian2(p.x,p.y)),hit=ray&&Cesium.IntersectionTests.rayPlane(ray,Cesium.Plane.fromPointNormal(grab.P0,grab.normal));
      if(hit&&Cesium.Cartesian3.distance(hit,camera.position)<40000){const d=Cesium.Cartesian3.subtract(grab.P0,hit,new Cesium.Cartesian3());
        camera.setView({destination:Cesium.Cartesian3.add(camera.position,d,new Cesium.Cartesian3()),orientation:{heading:camera.heading,pitch:camera.pitch,roll:0}})}}
    else{const dx=p.x-grab.last.x,dy=p.y-grab.last.y;camera.setView({orientation:{heading:camera.heading-dx*SETTINGS.skyDragSpeed,pitch:Math.max(-Cesium.Math.PI_OVER_TWO+0.01,Math.min(Cesium.Math.toRadians(60),camera.pitch+dy*SETTINGS.skyDragSpeed)),roll:0}})}
    grab.last=p;scene.requestRender()});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size!==1)grab=null};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
})();
(function earthGestures(){
  const el=scene.canvas;let g=null;
  const two=t=>{const r=el.getBoundingClientRect();return [0,1].map(i=>({x:t[i].clientX-r.left,y:t[i].clientY-r.top}))};

camera.changed.addEventListener(updateBuildingVisibility);camera.moveEnd.addEventListener(updateBuildingVisibility);
// --- 読み込み ---
const BB=()=>{const [s_,w_,n_,e_]=COURSE.bbox;return s_+','+w_+','+n_+','+e_};
// 管理区域KMLの範囲：建物はこの多角形の内側だけ取得・表示する
const KML_POLY=()=>boundary.map(q=>q[1]+' '+q[0]).join(' ');
function inKml(q){let ins=false;for(let i=0,j=boundary.length-1;i<boundary.length;j=i++){const a=boundary[i],b=boundary[j];if((a[1]>q[1])!==(b[1]>q[1])&&q[0]<(b[0]-a[0])*(q[1]-a[1])/(b[1]-a[1])+a[0])ins=!ins}return ins}
const buildingInKml=f=>{const r=f.geometry&&f.geometry.coordinates&&f.geometry.coordinates[0];return !!r&&r.length>=4&&inKml(ringCenter(r))};
const OBJ3D_SRC={
  lifts:{label:'リフト',query:()=>'[out:json][timeout:60];way["aerialway"]('+BB()+')->.l;.l out geom;node(w.l)["aerialway"~"^(pylon|station)$"];out;',convert:osmToLifts3d,set:g=>{lifts3dGeo=g},draw:drawLifts},
  buildings:{label:'建物',query:()=>'[out:json][timeout:90];(way["building"](poly:"'+KML_POLY()+'");relation["building"]["type"="multipolygon"](poly:"'+KML_POLY()+'"););out geom;',convert:osmToBuildings,set:g=>{buildingsGeo=g},draw:drawBuildings}};
const obj3dCount={};
function showObj3dInfo(){document.getElementById('obj3dInfo').textContent=['lifts','buildings'].map(k=>OBJ3D_SRC[k].label+(obj3dCount[k]||'未読み込み')).join('／')}
async function loadObj3d(kind,forceOsm){const S=OBJ3D_SRC[kind];let geo=null,src='';
  if(!forceOsm&&EDIT&&kind==='lifts'){const v=lsGet(OBJ3D.keys.liftsEdit);if(v&&v.features&&v.features.length){geo=v;src='端末で編集中のデータ'}}
  if(!forceOsm&&!geo){try{const r=await fetch(OBJ3D.files[kind],{cache:'no-cache'});if(r.ok){geo=await r.json();src=OBJ3D.files[kind].split('/').pop()}else obj3dLog.add('・'+S.label+'：'+OBJ3D.files[kind].split('/').pop()+' はまだ無い')}catch(e){}
    if(!geo){const v=lsGet(OBJ3D.keys[kind]);if(v&&v.features&&v.features.length){geo=v;src='端末に保存した取得結果'}}}
  if(!geo){obj3dLog.add('… '+S.label+'をOpenStreetMapから取得中');try{geo=S.convert(await overpassQuery(S.query(),S.label));src='OSMから取得';if(!lsSet(OBJ3D.keys[kind],geo))obj3dLog.add('・'+S.label+'：端末に保存できませんでした（容量不足）。書き出しボタンで保存してください')}
    catch(e){obj3dLog.add('✗ '+S.label+'を取得できませんでした','ng');obj3dCount[kind]='：取得失敗';showObj3dInfo();return}}
  if(kind==='buildings'){const before=geo.features.length;geo={...geo,features:geo.features.filter(buildingInKml)};if(before!==geo.features.length)obj3dLog.add('・建物：管理区域KMLの範囲外の'+(before-geo.features.length)+'件を除外')}  // ファイル・端末の保存から読んだ場合も範囲外は表示しない
  S.set(geo);const n=geo.features.length;obj3dCount[kind]=n+'件（'+src+'）';showObj3dInfo();
  const m=await S.draw();if(kind==='lifts'){const L=geo.features.filter(isLiftF),boxes=L.reduce((k,f)=>k+(f.properties.stations||[]).filter(x=>x.pos).length,0);obj3dCount[kind]=L.length+'本・支柱'+m+'本・駅舎の箱'+boxes+'（'+src+'）'}showObj3dInfo();obj3dLog.add('✓ '+S.label+'：'+n+'件を表示','ok')}
function downloadGeo(geo,name){if(!geo){alert('まだデータがありません');return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(geo)],{type:'application/geo+json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
document.getElementById('liftsOn').onchange=e=>{liftsSrc.show=e.target.checked;scene.requestRender()};
document.getElementById('bldOn').onchange=()=>updateBuildingVisibility();
document.getElementById('liftsExport').onclick=()=>downloadGeo(lifts3dGeo,'lifts3d.geojson');
document.getElementById('bldExport').onclick=()=>downloadGeo(buildingsGeo,'buildings.geojson');
document.getElementById('obj3dRefetch').onclick=async()=>{if(!confirm('リフトと建物を OpenStreetMap から取り直しますか？'+(EDIT?'（駅舎の位置の編集は破棄されます）':'')))return;try{localStorage.removeItem(OBJ3D.keys.liftsEdit);localStorage.removeItem(OBJ3D.keys.lifts);localStorage.removeItem(OBJ3D.keys.buildings)}catch(e){}
  await loadObj3d('lifts',true);await loadObj3d('buildings',true)};
showObj3dInfo();
// 編集モード：駅舎の箱をドラッグすると地表に沿って動く（ワイヤーも追従）。位置は端末に保存し、lifts3d書き出しに含まれる
if(EDIT){let sd=null,raf=0;const cv=scene.canvas,loc=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  const ground=(x,y)=>{const ray=camera.getPickRay(new Cesium.Cartesian2(x,y)),p=ray&&globe.pick(ray,scene);if(!p)return null;const c=Cesium.Cartographic.fromCartesian(p);return [+Cesium.Math.toDegrees(c.longitude).toFixed(7),+Cesium.Math.toDegrees(c.latitude).toFixed(7)]};
  // 地図の操作やコース編集より先に判定するため、documentの捕捉段階で受ける
  document.addEventListener('pointerdown',e=>{if(e.target!==cv||sd||drawing)return;const [x,y]=loc(e),hit=scene.pick(new Cesium.Cartesian2(x,y)),ent=hit&&hit.id;
    if(ent&&ent.__st&&document.getElementById('liftsOn').checked){sd={id:e.pointerId,st:ent.__st,moved:false};e.stopPropagation()}},true);
  document.addEventListener('pointermove',e=>{if(!sd||e.pointerId!==sd.id)return;e.stopPropagation();const ll=ground(...loc(e));if(!ll)return;
    sd.st.station.pos=ll;sd.st.station.source='edited';sd.moved=true;if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(sd)drawLift(sd.st.f)})},true);
  const up=e=>{if(!sd||e.pointerId!==sd.id)return;e.stopPropagation();const s_=sd;sd=null;
    if(s_.moved){drawLift(s_.st.f);lifts3dGeo.properties=lifts3dGeo.properties||{};lifts3dGeo.properties.edited=new Date().toISOString();
      const ok=lsSet(OBJ3D.keys.liftsEdit,lifts3dGeo);obj3dLog.add(ok?'✓ 駅舎の位置を保存しました（'+(s_.st.f.properties.name||'リフト')+'）':'✗ 駅舎の位置を端末に保存できませんでした',ok?'ok':'ng')}};
  document.addEventListener('pointerup',up,true);document.addEventListener('pointercancel',up,true);
  obj3dLog.add('編集モード：リフト両端の駅舎の箱はドラッグで位置を直せます');obj3dLog.add('編集モード中は軽くするため建物と支柱を表示しません')}
(async()=>{await loadObj3d('lifts');await loadObj3d('buildings')})();
// ===== 視点スティック（左下）=====
// FPSの右スティックと同じ：左右に倒すとその場で左右に回り、上下に倒すと見上げ・見下ろし。カメラの位置は変えない。
// 倒している間は一定速度で回り続け、離すと即停止。指ごとに追跡するので、ミニマップなどと同時に操作できる。
(function viewStick(){
  const el=document.getElementById('stick'),knob=el.querySelector('.knob');
  let pid=null,dirX=0,dirY=0,last=0,raf=0;
  function setDir(e){const r=el.getBoundingClientRect(),R=r.width/2,x=e.clientX-r.left-R,y=e.clientY-r.top-R,d=Math.hypot(x,y),k=d>R*0.6?R*0.6/d:1;
    knob.style.transform='translate('+x*k+'px,'+y*k+'px)';
    if(d<R*0.18){dirX=dirY=0;return}  // 中央付近は止まる
    dirX=Math.abs(x)>d*0.38?Math.sign(x):0;dirY=Math.abs(y)>d*0.38?Math.sign(y):0}  // 倒した向きだけを見る（倒し量で速さは変えない）
  function tick(t){if(pid===null)return;let dt=(t-last)/1000;last=t;dt=dt>1||dt<0?0:Math.min(dt,0.25);  // 実際の経過時間で回す＝フレームが落ちても速さ一定（タブ復帰時の飛びだけ防ぐ）
    if(dirX||dirY){const pitch=Math.max(-Cesium.Math.PI_OVER_TWO+0.01,Math.min(Cesium.Math.toRadians(60),camera.pitch-dirY*Cesium.Math.toRadians(SETTINGS.stickPitchSpeed)*dt));
      camera.setView({orientation:{heading:camera.heading+dirX*Cesium.Math.toRadians(SETTINGS.stickYawSpeed)*dt,pitch,roll:0}});scene.requestRender()}
    raf=requestAnimationFrame(tick)}
  el.addEventListener('pointerdown',e=>{if(pid!==null)return;pid=e.pointerId;el.setPointerCapture(pid);setDir(e);last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);e.preventDefault()});
  el.addEventListener('pointermove',e=>{if(e.pointerId===pid){setDir(e);e.preventDefault()}});
  const end=e=>{if(e.pointerId!==pid)return;pid=null;dirX=dirY=0;cancelAnimationFrame(raf);knob.style.transform=''};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('lostpointercapture',end);
})();
// ===== iPad Safariで長押し・操作中のテキスト選択と長押しメニューを防ぐ（文字入力欄は除く）=====
{const editable=e=>{const t=e.target&&(e.target.nodeType===1?e.target:e.target.parentElement);return !!(t&&t.closest&&t.closest('input:not([type=range]):not([type=checkbox]):not([type=color]),textarea,[contenteditable=true]'))};
 document.addEventListener('selectstart',e=>{if(!editable(e))e.preventDefault()});
 document.addEventListener('contextmenu',e=>{if(!editable(e))e.preventDefault()});}
// ===== iPad Safariのページ全体の拡大を防ぐ（user-scalable=noが無視される場合の対策）=====
for(const t of ['gesturestart','gesturechange','gestureend'])document.addEventListener(t,e=>e.preventDefault(),{passive:false});
{let lastEnd=0;document.addEventListener('touchend',e=>{const now=Date.now();
  if(now-lastEnd<350&&!e.target.closest('button,input,label,a'))e.preventDefault();  // 素早い2回目のタップによる拡大を止める
  lastEnd=now},{passive:false});}
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
// ===== 初期視点の保存とコピー =====
document.getElementById('viewSave').onclick=()=>{const c=camera.positionCartographic,g=globe.getHeight(c),ground=g!==undefined?g:lastGround;
  const v={lon:+Cesium.Math.toDegrees(c.longitude).toFixed(6),lat:+Cesium.Math.toDegrees(c.latitude).toFixed(6),height:+c.height.toFixed(1),
    heading:+Cesium.Math.toDegrees(camera.heading).toFixed(1),pitch:+Cesium.Math.toDegrees(camera.pitch).toFixed(1),aboveGround:ground!=null?+(c.height-ground).toFixed(1):null};
  try{localStorage.setItem(VIEW_KEY,JSON.stringify(v));alert('現在の視点を初期位置に保存しました。次回はここから始まります（地表から約'+(v.aboveGround!=null?Math.round(v.aboveGround)+'m':'?')+'）')}
  catch(e){alert('保存できませんでした（ブラウザの保存領域が使えません）')}};
document.getElementById('viewCopy').onclick=async()=>{let v=null;try{v=JSON.parse(localStorage.getItem(VIEW_KEY)||'null')}catch(e){}
  if(!v){alert('まだ初期視点が保存されていません。先に「現在の視点を初期位置にする」を押してください');return}
  const txt=JSON.stringify(v);alert(await copyText(txt)?'初期視点をコピーしました。cesium/index.html の DEFAULT_VIEW に貼ると全端末で同じ初期視点になります\n'+txt:'コピーできませんでした：'+txt)};
// ===== 「ゲレンデ向き」：本体カメラとミニマップを方位250度・既定の傾きに戻す（数値はSETTINGSで変更）=====
document.getElementById('slope').onclick=()=>{
  const c=camera.positionCartographic;let h=c.height;
  if(SETTINGS.resetHeight!=null){const g=globe.getHeight(c),ground=g!==undefined?g:lastGround;if(ground!=null){h=ground+SETTINGS.resetHeight;followActive=followOn.checked;followSuppressed=false}}
  camera.setView({destination:Cesium.Cartesian3.fromRadians(c.longitude,c.latitude,h),orientation:{heading:Cesium.Math.toRadians(SETTINGS.resetHeading),pitch:Cesium.Math.toRadians(SETTINGS.resetPitch),roll:0}});
  mini.setZoom(SETTINGS.minimapZoom);scene.requestRender()};
// ===== 折りたたみ式パネル：普段は左上のアイコンだけ。開いた状態は端末に記憶 =====
(function panelToggle(){const panel=document.getElementById('panel'),openBtn=document.getElementById('panelOpen');
  const set=open=>{panel.classList.toggle('collapsed',!open);openBtn.classList.toggle('hidden',open);try{localStorage.setItem('happoPanelOpen',open?'1':'0')}catch(e){}};
  openBtn.onclick=()=>set(true);document.getElementById('panelClose').onclick=()=>set(false);
  let open=false;try{open=localStorage.getItem('happoPanelOpen')==='1'}catch(e){}
  if(EDIT)open=true;  // 編集モードは操作ボタンが多いので開いた状態で始める
  set(open)})();
statusEl.textContent='表示中：国土地理院 航空写真＋標高(10m/5m)（冬季画像ではありません）';
</script>
