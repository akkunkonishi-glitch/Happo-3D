<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>八方尾根3D管理 試作</title><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>html,body,#map{margin:0;width:100%;height:100%;font-family:system-ui}#panel{position:absolute;top:12px;left:12px;background:#ffffffee;padding:12px;border-radius:12px;max-width:260px;box-shadow:0 2px 12px #0003}button,select{padding:8px;margin:3px;border-radius:7px;border:1px solid #aaa;background:white}#status{font-size:12px;color:#444}#total{font-weight:bold}#map{background:#c5d7e4}</style></head><body><div id="map"></div><div id="panel"><b>八方尾根 3D 管理マップ</b><div id="status">地図ライブラリを読み込み中…</div><div><button id="tilt">3D表示</button><button id="flat">真上から</button></div><div><button id="draw">ロープを描く</button><button id="undo">1点戻す</button><button id="clear">消去</button></div><div id="total">ロープ距離: 0 m</div><small>赤線：指定KML範囲。地図上をタップしてロープの点を追加。距離は水平概算。</small></div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const boundary=[[137.79031276702884, 36.71360253057494], [137.79031276702884, 36.71360253057494], [137.78507709503177, 36.709955790915565], [137.78507709503177, 36.709955790915565], [137.78447628021243, 36.705345513841785], [137.78447628021243, 36.705345513841785], [137.7805280685425, 36.68999886813347], [137.7805280685425, 36.68999886813347], [137.7827596664429, 36.685456224030055], [137.7827596664429, 36.685456224030055], [137.80009746551517, 36.673065830877334], [137.80009746551517, 36.673065830877334], [137.8038311004639, 36.67110383562481], [137.8038311004639, 36.67110383562481], [137.808895111084, 36.67351329647276], [137.808895111084, 36.67351329647276], [137.81473159790042, 36.68012171607383], [137.81473159790042, 36.68012171607383], [137.82494544982913, 36.68397636535661], [137.82494544982913, 36.68397636535661], [137.84365653991702, 36.69608971975234], [137.84365653991702, 36.69608971975234], [137.84760475158694, 36.69963389154272], [137.84760475158694, 36.69963389154272], [137.8463172912598, 36.709061281169646], [137.8463172912598, 36.709061281169646], [137.8379058837891, 36.71525382744859], [137.8379058837891, 36.71525382744859], [137.82709121704104, 36.721273880045004], [137.82709121704104, 36.721273880045004], [137.8239154815674, 36.72086109150479], [137.8239154815674, 36.72086109150479], [137.8115558624268, 36.71604506128931], [137.8115558624268, 36.71604506128931], [137.80554771423343, 36.715150622433804], [137.80554771423343, 36.715150622433804], [137.7917289733887, 36.713912151442244], [137.7917289733887, 36.713912151442244]];
const center=[(Math.min(...boundary.map(p=>p[0]))+Math.max(...boundary.map(p=>p[0])))/2,(Math.min(...boundary.map(p=>p[1]))+Math.max(...boundary.map(p=>p[1])))/2];
const status=document.getElementById('status');let drawing=false,rope=[];
if(!window.maplibregl){status.textContent='ライブラリを読み込めません。HTTPSで公開して開いてください。';}
else{
const map=new maplibregl.Map({container:'map',center,zoom:11.5,pitch:65,bearing:-15,style:{version:8,sources:{photo:{type:'raster',tiles:['https://cyberjapandata.gsi.go.jp/xyz/ort/{z}/{x}/{y}.jpg'],tileSize:256,attribution:'国土地理院'},dem:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,encoding:'terrarium',maxzoom:14}},layers:[{id:'photo',type:'raster',source:'photo'}],terrain:{source:'dem',exaggeration:1}}});
map.addControl(new maplibregl.NavigationControl(),'bottom-right');
function feature(points,kind){return {type:'Feature',geometry:{type:kind,coordinates:points},properties:{}}}
const boundaryGeo={type:'FeatureCollection',features:[feature([...boundary,boundary[0]],'LineString')]};
const ropeGeo=()=>({type:'FeatureCollection',features:rope.length>=2?[feature(rope,'LineString')]:[]});
const ptsGeo=()=>({type:'FeatureCollection',features:rope.map(p=>feature(p,'Point'))});
map.on('load',()=>{map.addSource('boundary',{type:'geojson',data:boundaryGeo});map.addLayer({id:'boundary',type:'line',source:'boundary',paint:{'line-color':'#f44336','line-width':3}});map.addSource('rope',{type:'geojson',data:ropeGeo()});map.addLayer({id:'rope',type:'line',source:'rope',paint:{'line-color':'#ffde00','line-width':4}});map.addSource('points',{type:'geojson',data:ptsGeo()});map.addLayer({id:'points',type:'circle',source:'points',paint:{'circle-color':'#ffde00','circle-radius':5,'circle-stroke-color':'#222','circle-stroke-width':1}});map.fitBounds([[Math.min(...boundary.map(p=>p[0])),Math.min(...boundary.map(p=>p[1]))],[Math.max(...boundary.map(p=>p[0])),Math.max(...boundary.map(p=>p[1]))]],{padding:65,duration:0});map.setPitch(60);status.textContent='航空写真・標高タイルを読み込み中（通信が必要）';});
map.on('idle',()=>{status.textContent='表示中：地理院航空写真＋標高地形（冬季画像ではありません）'});
map.on('error',e=>{status.textContent='一部の地図データが取得できません: '+(e.error?.message||'通信エラー')});
function distance(a,b){let R=6371000,rad=Math.PI/180,dlat=(b[1]-a[1])*rad,dlon=(b[0]-a[0])*rad,q=Math.sin(dlat/2)**2+Math.cos(a[1]*rad)*Math.cos(b[1]*rad)*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function update(){map.getSource('rope')?.setData(ropeGeo());map.getSource('points')?.setData(ptsGeo());let d=0;for(let i=1;i<rope.length;i++)d+=distance(rope[i-1],rope[i]);document.getElementById('total').textContent='ロープ距離: '+Math.round(d)+' m ('+rope.length+'点)'}
map.on('click',e=>{if(drawing){rope.push([e.lngLat.lng,e.lngLat.lat]);update()}});
document.getElementById('draw').onclick=()=>{drawing=!drawing;document.getElementById('draw').textContent=drawing?'描画終了':'ロープを描く';map.getCanvas().style.cursor=drawing?'crosshair':''};
document.getElementById('undo').onclick=()=>{rope.pop();update()};
document.getElementById('clear').onclick=()=>{rope=[];update()};
document.getElementById('tilt').onclick=()=>map.easeTo({pitch:65,duration:500});
document.getElementById('flat').onclick=()=>map.easeTo({pitch:0,bearing:0,duration:500});
}
</script></body></html>
